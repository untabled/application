<a [routerLink]="'../' + organization.id">
  <untabled-card
    class="group transition-colors duration-100 hover:bg-neutral-50"
  >
    <div class="flex items-center gap-4">
      <div
        class="bg-primary-300 flex h-10 w-10 items-center justify-center rounded-md font-semibold text-neutral-900"
      >
        {{ organization.name.slice(0, 2).toUpperCase() }}
      </div>

      <span class="font-medium text-neutral-900">{{ organization.name }}</span>

      <span
        class="ml-auto text-neutral-200 transition-colors duration-100 group-hover:text-neutral-700"
      >
        <untabled-icon [icon]="['fas', 'chevron-right']" />
      </span>
    </div>
  </untabled-card>
</a>
