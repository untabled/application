<form class="w-96 space-y-4 p-8" (submit)="$event.preventDefault(); submit()">
  <untabled-text-input
    [control]="form.controls.email"
    type="email"
    label="Email"
  />
  <untabled-text-input
    [control]="form.controls.password"
    type="password"
    label="Wachtwoord"
    info="Password must contain at least 8 characters and 1 special character."
  />

  <button
    untabledButton="secondary"
    [icon]="['far', 'lemon']"
    [loading]="loading$ | async"
  >
    Inloggen
  </button>
</form>
