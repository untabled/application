<form class="w-96 space-y-4 p-8" (submit)="$event.preventDefault(); submit()">
  <untabled-text-input
    [control]="form.controls.email"
    type="email"
    label="Email"
  />
  <untabled-text-input
    [control]="form.controls.password"
    type="password"
    label="Wachtwoord"
    info="Password must contain at least 8 characters and 1 special character."
  />

  <button
    class="bg-primary-300 block w-full appearance-none rounded-md border-0 px-3 py-2 text-sm font-medium text-neutral-900 outline-none"
  >
    Inloggen
  </button>
</form>
