<h1 class="text-2xl font-semibold">Account aanmaken</h1>
<p class="mt-2 text-sm text-neutral-600">
  Voer uw gegevens in om een account aan te maken.
</p>

<form
  class="mt-8 flex flex-col gap-2"
  (submit)="$event.preventDefault(); submit()"
>
  <untabled-text-input
    [control]="form.controls.email"
    type="email"
    placeholder="you@domain.com"
    label="Email"
  />

  <untabled-text-input
    [control]="form.controls.name"
    label="Name"
    placeholder="Hoe mogen wij jou noemen?"
  />

  <untabled-text-input
    [control]="form.controls.password"
    type="password"
    label="Wachtwoord"
    placeholder="••••••••"
    info="Password must contain at least 8 characters and 1 special character."
  />

  <button
    class="mt-4"
    untabledButton="primary"
    [icon]="['far', 'lemon']"
    [loading]="loading$ | async"
  >
    Aanmelden
  </button>
</form>

<span class="mt-4 block text-sm text-neutral-600"
  >Al een account?
  <a routerLink="/auth/signin" class="text-primary-700 font-medium"
    >Inloggen</a
  ></span
>
