<div
  *ngIf="sidebarOpen$ | async"
  (click)="$event.stopPropagation()"
  class="h-screen w-[16rem] rounded-r-3xl bg-white p-4 drop-shadow-xl"
  @enter
>
  <div class="flex w-full items-center justify-between">
    <span class="px-1 font-serif text-xl antialiased">Untabled</span>

    <button
      (click)="$event.stopPropagation(); toggleSidebar()"
      class="flex h-8 w-8 items-center justify-center rounded-md bg-white text-neutral-600 transition-colors duration-75 hover:bg-neutral-100 hover:text-neutral-900"
    >
      <untabled-icon name="ionClose" size="20" />
    </button>
  </div>

  <nav class="mt-4 flex flex-col gap-0.5">
    <untabled-menu-item link="dashboard" icon="ionHome" label="Dashboard" />
    <untabled-menu-item link="as" icon="ionPizza" label="Pizza" />
    <untabled-menu-item link="asddsa" icon="ionFastFood" label="Fastfood" />
  </nav>
</div>
